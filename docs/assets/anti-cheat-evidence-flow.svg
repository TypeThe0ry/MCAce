<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">MCAce anti-cheat evidence boundary</title>
  <desc id="desc">A client artifact and behavior observation flow from low-confidence report to pending server confirmation.</desc>
  <rect width="1200" height="380" rx="20" fill="#0b1220"/>
  <text x="50" y="54" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="28" font-weight="700">Anti-cheat evidence boundary</text>
  <g font-family="Segoe UI, sans-serif" font-size="16">
    <rect x="48" y="120" width="210" height="132" rx="16" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
    <text x="153" y="160" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">Client</text>
    <text x="153" y="192" text-anchor="middle" fill="#cbd5e1">Meteor / Xray</text>
    <text x="153" y="220" text-anchor="middle" fill="#cbd5e1">manifest + behavior</text>
    <path d="M258 186 H365" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="365" y="120" width="210" height="132" rx="16" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
    <text x="470" y="160" text-anchor="middle" fill="#bfdbfe" font-size="20" font-weight="700">MCAce</text>
    <text x="470" y="192" text-anchor="middle" fill="#dbeafe">CLIENT_REPORTED</text>
    <text x="470" y="220" text-anchor="middle" fill="#dbeafe">low-confidence OBSERVE</text>
    <path d="M575 186 H682" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="682" y="120" width="210" height="132" rx="16" fill="#3f2a0a" stroke="#fbbf24" stroke-width="2"/>
    <text x="787" y="160" text-anchor="middle" fill="#fde68a" font-size="20" font-weight="700">Server</text>
    <text x="787" y="192" text-anchor="middle" fill="#fef3c7">behavior correlation</text>
    <text x="787" y="220" text-anchor="middle" fill="#fef3c7">Vulcan/Grim pending</text>
    <path d="M892 186 H999" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="999" y="120" width="153" height="132" rx="16" fill="#451a03" stroke="#fb923c" stroke-width="2"/>
    <text x="1075" y="160" text-anchor="middle" fill="#fed7aa" font-size="20" font-weight="700">Action</text>
    <text x="1075" y="192" text-anchor="middle" fill="#ffedd5">manual review</text>
    <text x="1075" y="220" text-anchor="middle" fill="#ffedd5">current conn only</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
  </defs>
</svg>
