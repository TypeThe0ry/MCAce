<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">MCAce production server authority and evidence chain</title>
  <desc id="desc">Distinct anti-cheat provider events are deduplicated, correlated under an exact frozen profile, signed and journaled by Paper, verified by the proxy, constrained to the action ceiling, and packaged only with an independently pinned supervisor receipt.</desc>
  <defs><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0 0 L0 8 L10 4 Z" fill="#64748b"/></marker></defs>
  <rect width="1400" height="620" rx="24" fill="#0b1220"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="52" y="62" fill="#f8fafc" font-size="31" font-weight="700">Production SERVER_CONFIRMED trust chain</text>
    <text x="52" y="94" fill="#94a3b8" font-size="17">No narrative PASS: raw frames, stable bytes, exact identities, signatures, and an external release receipt are required.</text>

    <rect x="52" y="145" width="210" height="165" rx="18" fill="#10243b" stroke="#38bdf8" stroke-width="2"/>
    <text x="157" y="187" text-anchor="middle" fill="#7dd3fc" font-size="21" font-weight="700">Provider events</text>
    <text x="157" y="225" text-anchor="middle" fill="#e0f2fe" font-size="17">Grim trust domain</text>
    <text x="157" y="254" text-anchor="middle" fill="#e0f2fe" font-size="17">Vulcan trust domain</text>
    <text x="157" y="285" text-anchor="middle" fill="#bae6fd" font-size="15">genuine · non-experimental</text>

    <path d="M262 228 H318" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
    <rect x="319" y="145" width="240" height="165" rx="18" fill="#27154b" stroke="#c084fc" stroke-width="2"/>
    <text x="439" y="187" text-anchor="middle" fill="#e9d5ff" font-size="21" font-weight="700">Event identity</text>
    <text x="439" y="225" text-anchor="middle" fill="#f3e8ff" font-size="16">providerEventIdSha256</text>
    <text x="439" y="254" text-anchor="middle" fill="#f3e8ff" font-size="16">one callback counts once</text>
    <text x="439" y="285" text-anchor="middle" fill="#d8b4fe" font-size="15">replay cannot reach threshold</text>

    <path d="M559 228 H615" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
    <rect x="616" y="145" width="240" height="165" rx="18" fill="#3f2a0a" stroke="#fbbf24" stroke-width="2"/>
    <text x="736" y="187" text-anchor="middle" fill="#fde68a" font-size="21" font-weight="700">Exact profile quorum</text>
    <text x="736" y="225" text-anchor="middle" fill="#fef3c7" font-size="16">version · stable family</text>
    <text x="736" y="254" text-anchor="middle" fill="#fef3c7" font-size="16">window · threshold · domains</text>
    <text x="736" y="285" text-anchor="middle" fill="#fde68a" font-size="15">cooldown + single use</text>

    <path d="M856 228 H912" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
    <rect x="913" y="145" width="210" height="165" rx="18" fill="#102a1b" stroke="#4ade80" stroke-width="2"/>
    <text x="1018" y="187" text-anchor="middle" fill="#86efac" font-size="21" font-weight="700">Paper authority</text>
    <text x="1018" y="225" text-anchor="middle" fill="#f0fdf4" font-size="16">raw signed frame</text>
    <text x="1018" y="254" text-anchor="middle" fill="#f0fdf4" font-size="16">journal before send</text>
    <text x="1018" y="285" text-anchor="middle" fill="#bbf7d0" font-size="15">durable sequence recovery</text>

    <path d="M1123 228 H1179" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
    <rect x="1180" y="145" width="168" height="165" rx="18" fill="#102a1b" stroke="#4ade80" stroke-width="2"/>
    <text x="1264" y="187" text-anchor="middle" fill="#86efac" font-size="21" font-weight="700">Proxy</text>
    <text x="1264" y="225" text-anchor="middle" fill="#f0fdf4" font-size="16">verify signature</text>
    <text x="1264" y="254" text-anchor="middle" fill="#f0fdf4" font-size="16">bind session</text>
    <text x="1264" y="285" text-anchor="middle" fill="#bbf7d0" font-size="15">SERVER_CONFIRMED</text>

    <path d="M1264 310 V374 H1018" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
    <rect x="760" y="374" width="516" height="148" rx="18" fill="#2a1d12" stroke="#f59e0b" stroke-width="2"/>
    <text x="1018" y="416" text-anchor="middle" fill="#fcd34d" font-size="21" font-weight="700">External capture supervisor + publisher</text>
    <text x="1018" y="452" text-anchor="middle" fill="#fef3c7" font-size="16">stable raw bytes · Ed25519 verification · provider-event commitment</text>
    <text x="1018" y="482" text-anchor="middle" fill="#fef3c7" font-size="16">approved public pin · release-bundle identity · detached receipt</text>
    <text x="1018" y="509" text-anchor="middle" fill="#fde68a" font-size="14">missing licensed/genuine evidence → release remains locked</text>

    <path d="M760 448 H618" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
    <rect x="264" y="374" width="354" height="148" rx="18" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
    <text x="441" y="416" text-anchor="middle" fill="#bfdbfe" font-size="21" font-weight="700">Disposition ceiling</text>
    <text x="441" y="452" text-anchor="middle" fill="#dbeafe" font-size="17">MONITOR / configured signed ceiling</text>
    <text x="441" y="483" text-anchor="middle" fill="#dbeafe" font-size="16">no silent production kick or ban claim</text>
    <text x="700" y="576" text-anchor="middle" fill="#64748b" font-size="14">Every release claim is bound to the immutable source commit and exact deployable JARs.</text>
  </g>
</svg>
