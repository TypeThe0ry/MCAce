    <text x="78" y="232" fill="#e2e8f0" font-size="17">Fabric Loader 0.19.3</text>
    <text x="78" y="262" fill="#e2e8f0" font-size="17">Yarn + final remap JAR</text>
    <rect x="78" y="292" width="120" height="38" rx="19" fill="#14532d"/>
    <text x="138" y="317" text-anchor="middle" fill="#bbf7d0" font-size="16" font-weight="700">VERIFIED</text>
    <rect x="425" y="120" width="350" height="245" rx="16" fill="#15243c" stroke="#a78bfa" stroke-width="2"/>
    <text x="453" y="164" fill="#c4b5fd" font-size="26" font-weight="700">26.1.2</text>
    <text x="453" y="200" fill="#e2e8f0" font-size="18">Protocol 775 · Java 25</text>
    <text x="453" y="232" fill="#e2e8f0" font-size="17">Fabric Loader 0.19.3</text>
    <text x="453" y="262" fill="#e2e8f0" font-size="17">Official named final JAR</text>
    <rect x="453" y="292" width="120" height="38" rx="19" fill="#14532d"/>
    <text x="513" y="317" text-anchor="middle" fill="#bbf7d0" font-size="16" font-weight="700">VERIFIED</text>
    <rect x="800" y="120" width="350" height="245" rx="16" fill="#20223a" stroke="#fbbf24" stroke-width="2"/>
    <text x="828" y="164" fill="#fde68a" font-size="26" font-weight="700">26.2</text>
    <text x="828" y="200" fill="#e2e8f0" font-size="18">Protocol 776 · Java 25</text>
    <text x="828" y="232" fill="#e2e8f0" font-size="17">Fabric Loader 0.19.3</text>
