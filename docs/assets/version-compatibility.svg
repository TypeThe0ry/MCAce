<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">MCAce exact Minecraft compatibility matrix</title>
  <desc id="desc">Three exact release targets with protocol, Java, artifact mode, and verification status.</desc>
  <rect width="1200" height="430" rx="20" fill="#0b1220"/>
  <text x="50" y="58" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="30" font-weight="700">Exact compatibility contract</text>
  <text x="50" y="88" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="16">Unsupported patch versions fail closed; no protocol-threshold inference.</text>
