# Behavior integrations are observational only. They never punish or alter admission.
session-actions:
  # MONITOR is the default. SESSION_ACTIONS only affects this current backend connection;
  # LIMITED sends one bounded notice per accepted transition. BLOCKED ends only the
  # current connection. It never bans an account or device.
  mode: MONITOR
  limited-message: "MCAce: this session has limited access. Please reconnect or contact staff."

behavior:
  enabled: false
  minimum-flags: 3
  window-seconds: 10
  cooldown-seconds: 30
  maximum-tracked-keys: 10000
  grim:
    enabled: true
  vulcan:
    enabled: true

# Signed Paper/Folia -> proxy SERVER_CONFIRMED authority. Phase 1 is MONITOR-only and
# remains completely inert unless every key, profile and preprovisioned journal field validates.
authority:
  enabled: false
  mode: MONITOR
  # When enabling, provide all fields below and pin the same profile/key on the proxy.
  # proxy-instance-id: "mcace-velocity-1"
  # backend-instance-id: "paper-survival-1"
  # backend-private-key-path: "authority/backend-private-key.pk8"
  # backend-public-key-path: "authority/backend-public-key.txt"
  # backend-key-id-sha256: "<lowercase SHA-256 of X.509 Ed25519 public key>"
  # issuance-journal-path: "authority/issuance.log"
  # journal-quota-bytes: 8388608
  # observation-ttl-ms: 10000
  # profile:
  #   sha256: "<canonical profile SHA-256>"
  #   required-independent-domains: 2
  #   maximum-provider-window-ms: 10000
  #   cooldown-ms: 30000
  #   providers:
  #     grim:
  #       trust-domain-id: "grim-engine"
  #       version: "<exact reviewed version>"
  #       stable-check-family: "<exact stable key>"
  #       threshold: 3
  #     vulcan:
  #       trust-domain-id: "vulcan-engine"
  #       version: "<exact reviewed version>"
  #       stable-check-family: "<exact stable key>"
  #       threshold: 3

cloud:
  enabled: false
  endpoint: "https://mcace.example.invalid"
  server-id: "paper-1"
  # Raw PKCS#8 Ed25519 private key. Relative paths only; every containing directory
  # must be owner-controlled/non-writable by other principals and the leaf must be
  # a no-link 0600 (or service-account/SYSTEM-only NTFS) regular file, max 4096 bytes.
  private-key-path: "cloud-server-private-key.pk8"
  queue-capacity: 1024
  request-timeout-ms: 5000
