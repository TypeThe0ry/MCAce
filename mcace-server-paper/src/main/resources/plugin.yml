name: MCAce
version: '${mcaceVersion}'
main: com.ellan.mcace.paper.MCAcePaperPlugin
api-version: '1.21'
folia-supported: true
authors: [EllanServer]
description: MCAce signed proxy admission state and server integration
softdepend: [GrimAC, Vulcan]
commands:
  mcace:
    description: Inspect MCAce player trust state
    usage: /mcace check <player>
    permission: mcace.admin
permissions:
  mcace.admin:
    description: Allows MCAce administrative commands
    default: op
